name: Create nanogen_EFT_13_0_X branch

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to retarget to nanogen_EFT_13_0_X (default: 1)'
        required: false
        default: '1'
  push:
    branches:
      - copilot/add-correct-eft-weights-reading

jobs:
  create-branch-and-retarget-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Create nanogen_EFT_13_0_X from CMSSW_13_0_X
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // SHA of CMSSW_13_0_X HEAD in cms-sw/cmssw (fork shares git objects)
            const cmssw_13_0_x_sha = 'ead39b29cdbc8ed76c34ba143ed54e964cdc4521';
            const newBranch = 'nanogen_EFT_13_0_X';

            // Check if branch already exists
            let branchExists = false;
            try {
              await github.rest.git.getRef({
                owner,
                repo,
                ref: `heads/${newBranch}`
              });
              branchExists = true;
              console.log(`Branch ${newBranch} already exists.`);
            } catch (e) {
              if (e.status !== 404) throw e;
            }

            if (!branchExists) {
              // Create the branch from CMSSW_13_0_X SHA
              await github.rest.git.createRef({
                owner,
                repo,
                ref: `refs/heads/${newBranch}`,
                sha: cmssw_13_0_x_sha
              });
              console.log(`Created branch ${newBranch} from ${cmssw_13_0_x_sha}`);
            }

            // Determine PR number: from input (workflow_dispatch) or find the open PR
            let prNumber;
            if (context.eventName === 'workflow_dispatch') {
              prNumber = parseInt(context.payload.inputs.pr_number);
            } else {
              // For push events, find the PR targeting master from this branch
              const prs = await github.rest.pulls.list({
                owner,
                repo,
                head: `${owner}:${context.ref.replace('refs/heads/', '')}`,
                state: 'open'
              });
              if (prs.data.length === 0) {
                console.log('No open PR found for this branch. Skipping PR retarget.');
                return;
              }
              prNumber = prs.data[0].number;
            }

            // Update the PR base branch
            const pr = await github.rest.pulls.get({ owner, repo, pull_number: prNumber });
            if (pr.data.base.ref !== newBranch) {
              await github.rest.pulls.update({
                owner,
                repo,
                pull_number: prNumber,
                base: newBranch
              });
              console.log(`Updated PR #${prNumber} base from '${pr.data.base.ref}' to '${newBranch}'`);
            } else {
              console.log(`PR #${prNumber} already targets '${newBranch}'. No update needed.`);
            }

